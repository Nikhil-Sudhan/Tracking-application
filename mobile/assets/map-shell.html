<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>__LEAFLET_CSS__ html,body,#map{height:100%;width:100%;margin:0}.leaflet-control-attribution{font-size:10px}</style></head><body><div id="map"></div><script>__LEAFLET_JS__</script><script>const map=L.map('map',{zoomControl:false}).setView([20.59,78.96],5);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map);let viewKey='';window.updateFieldMap=function(d){layer.clearLayers();let positions=[];d.sites.filter(s=>s.active).forEach(s=>{const name=document.createElement('span');name.textContent=s.name;L.circle([s.lat,s.lng],{radius:s.radius,color:'#17694f',weight:2,fillOpacity:.12}).bindTooltip(name).addTo(layer);});d.employees.filter(e=>e.lat!==null&&e.lng!==null).forEach(e=>{positions.push([e.lat,e.lng]);const stale=!e.lastSeen||Date.now()-e.lastSeen>300000;const dot=L.circleMarker([e.lat,e.lng],{radius:e.id===d.selected?13:9,weight:3,color:'white',fillColor:!e.shiftStart?'#83928a':stale?'#c28a31':'#17694f',fillOpacity:1}).addTo(layer);const label=document.createElement('span');label.textContent=e.name;dot.bindTooltip(label);dot.on('click',()=>window.ReactNativeWebView.postMessage(JSON.stringify({id:e.id})));});let route;if(d.points.length>1)route=L.polyline(d.points.map(p=>[p.lat,p.lng]),{color:'#2a6df4',weight:4}).addTo(layer);const key=d.selected+':'+d.points.length+':'+positions.length;if(key!==viewKey){if(route)map.fitBounds(route.getBounds(),{padding:[30,30]});else {const p=d.employees.find(e=>e.id===d.selected&&e.lat!==null&&e.lng!==null);if(p)map.setView([p.lat,p.lng],15);else if(positions.length)map.fitBounds(positions,{padding:[30,30],maxZoom:14});else if(d.sites.length)map.setView([d.sites[0].lat,d.sites[0].lng],14);}viewKey=key;}};</script></body></html>
